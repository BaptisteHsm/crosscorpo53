name: Résultats et publication

# Se lance quand un PDF est déposé dans pdfs/, quand le site change, ou à la main (onglet Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le lecteur de PDF
        run: npm install --no-audit --no-fund

      - name: Lire les PDF Scratch
        run: node scripts/build-data.mjs
        env:
          EXCLUSIONS: ${{ secrets.EXCLUSIONS }}

      - name: Enregistrer les résultats dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data pdfs
          if git diff --cached --quiet; then
            echo "Aucun changement de résultats."
          else
            git commit -m "Mise à jour des résultats"
            git push
          fi

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
