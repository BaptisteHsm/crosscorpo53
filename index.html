<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Résultats, classements et statistiques des Cross Corporatifs 53, saison 2026-2027.">
<title>Cross Corpo 53 · Résultats 2026-2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Contrail+One&family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Charte crosscorpo53.fr : fond clair, titres Contrail One, texte Open Sans, vert #3BAB35 + bleu, jaune, rose du logo, cartes grises arrondies. */
:root{
  --bg:#fbfbfb; --surface:#ffffff; --surface-2:#f2f5f2; --surface-3:#e8eee8; --line:#e1e7e1;
  --ink:#252725; --ink-2:#4d524d; --ink-3:#7c837c;
  --green:#3bab35; --green-dark:#2f8f2a; --green-soft:#f2f5f2;
  --blue:#0391da; --blue-soft:#e9f5fa;
  --amber:#ffb220; --amber-soft:#fff6e5;
  --pink:#d4145d;
  --gold:#e09a00; --silver:#8b939a; --bronze:#b5652f;
  --f:#d4145d; --m:#0391da;
  --display:"Contrail One","Arial Narrow",system-ui,sans-serif;
  --body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --r-lg:20px;
  --shadow:0 4px 18px rgba(37,39,37,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 72px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:-.1px;text-wrap:balance;margin:0;line-height:1.05}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}

/* En-tête : barre blanche arrondie, logo, titre centré, navigation */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px 20px;margin-bottom:44px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px 24px}
.top .logo{width:74px;height:auto;cursor:pointer}
.titleblock{text-align:center;min-width:0}
.eyebrow{font-family:var(--display);font-size:15px;color:var(--green)}
.top h1{font-size:clamp(24px,4.2vw,38px)}
.nav{justify-self:end;display:flex;gap:2px;flex-wrap:nowrap;justify-content:flex-end}
.nav a{white-space:nowrap;font-family:var(--display);font-size:17px;color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:var(--r)}
.nav a:hover{color:var(--green)}
.nav a[aria-current="page"]{color:var(--green)}

.btn{border:0;background:var(--surface-2);border-radius:var(--r);padding:9px 16px;font-family:var(--display);font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-dark)}
.btn.white{background:var(--surface);box-shadow:0 1px 4px rgba(37,39,37,.08)}
.btn.white:hover{color:var(--green)}
.btn svg{width:16px;height:16px;flex:none}

/* Recherche */
.searchzone{position:relative;max-width:760px;margin:12px auto 64px;text-align:center}
.searchzone h2{font-size:clamp(28px,5vw,44px);margin-bottom:22px}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:6px 6px 6px 20px;border:2px solid transparent}
.searchbox:focus-within{border-color:var(--green)}
.searchbox svg{width:20px;height:20px;color:var(--green);flex:none}
.searchbox input{flex:1;border:0;outline:0;background:none;font-size:17px;padding:10px 0;min-width:0}
.results{position:absolute;left:0;right:0;top:100%;margin-top:8px;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 16px 40px rgba(37,39,37,.16);text-align:left;z-index:15;overflow:hidden;max-height:min(70vh,520px);overflow-y:auto}
.results .grp{font-family:var(--display);font-size:14px;color:var(--green);padding:10px 16px 4px}
.results button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 16px}
.results button:hover,.results button.sel{background:var(--surface-2)}
.results .sub{color:var(--ink-3);font-size:12.5px}
.results .empty-r{padding:14px 16px;color:var(--ink-3)}

/* Liste des courses façon page officielle */
.sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0 20px}
.sectionhead h2{font-size:28px}
.racelist{display:flex;flex-direction:column;gap:16px}
.rl-head,.rl-row{display:grid;grid-template-columns:120px 296px minmax(0,1fr) auto;gap:24px;align-items:center}
.rl-head{padding:0 24px 4px;font-family:var(--display);font-size:20px}
.rl-row{background:var(--surface-2);border-radius:var(--r-lg);padding:20px 24px}
.rl-date{font-family:var(--display);font-size:21px}
.rl-n{font-family:var(--body);font-size:12px;font-weight:700;color:var(--ink-3);display:block;letter-spacing:.04em}
.rl-logos{display:flex;flex-wrap:wrap;gap:10px}
.tile{width:64px;height:64px;background:var(--surface);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:0 1px 4px rgba(37,39,37,.06)}
.tile img{max-width:100%;max-height:100%;object-fit:contain}
.rl-lieu{font-family:var(--display);font-size:20px}
.rl-res{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;max-width:440px;justify-self:end}
.rl-none{font-family:var(--display);font-size:19px;margin-right:6px}
.rl-row.season{margin-top:16px;background:var(--green);color:#fff}
.rl-row.season .rl-lieu,.rl-row.season .rl-date{color:#fff}
.rl-row.season .btn.white{color:var(--ink)}
@media (max-width:1060px){.rl-head,.rl-row{grid-template-columns:110px 220px minmax(0,1fr) auto}}
@media (max-width:860px){
  .rl-head{display:none}
  .rl-row{grid-template-columns:1fr auto;grid-template-areas:"date lieu" "logos logos" "res res";gap:10px}
  .rl-row.season .rl-lieu{grid-column:auto!important}
  .rl-date{grid-area:date}.rl-lieu{grid-area:lieu;text-align:right}.rl-logos{grid-area:logos}.rl-res{grid-area:res;justify-content:flex-start}
  .tile{width:52px;height:52px}
}

/* Page course */
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:28px}
.pagehead h2{font-size:clamp(28px,5vw,42px)}
.pagehead .sub{font-weight:600;color:var(--ink-2);margin-top:6px}
.back{font-family:var(--display);font-size:16px;color:var(--ink-2);text-decoration:none;display:inline-flex;gap:6px;align-items:center;margin-bottom:14px}
.back:hover{color:var(--green)}
.tabs{display:flex;gap:8px;margin-bottom:26px;overflow-x:auto;padding:2px 2px 4px}
.tab{background:none;border:0;border-radius:var(--r);padding:9px 16px;font-family:var(--display);font-size:18px;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.tab:hover{color:var(--green)}
.tab[aria-selected="true"]{color:var(--green);background:var(--surface);box-shadow:var(--shadow)}
.legnav{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px}
.legnav button{border:0;background:var(--surface-2);border-radius:var(--r);padding:6px 10px;font-family:var(--display);font-size:14px;white-space:nowrap;color:var(--ink-2)}
.legnav button[aria-current="true"]{background:var(--green);color:#fff}
.legnav button:disabled{opacity:.45;cursor:default}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:var(--r);padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}
.field{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 11px;min-width:0}
input.field{flex:1 1 220px}
select.field{flex:0 1 auto;max-width:100%}
.summary{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--ink-2);font-size:13.5px;margin:6px 0 14px}
.summary b{color:var(--ink);font-weight:700}

/* Tableaux en bandes grises */
.tablebox{overflow-x:auto}
table{border-collapse:separate;border-spacing:0 8px;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:11px 14px;text-align:left;white-space:nowrap}
th{font-family:var(--display);font-size:14px;font-weight:400;color:var(--ink);padding-block:4px}
tbody td{background:var(--surface-2)}
tbody td:first-child{border-radius:var(--r) 0 0 var(--r)}
tbody td:last-child{border-radius:0 var(--r) var(--r) 0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--green)}
th .arr{color:var(--green)}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-3)}
.pos{font-family:var(--display);font-size:19px;display:inline-block;min-width:2ch}
.p1{color:var(--gold)}.p2{color:var(--silver)}.p3{color:var(--bronze)}
.nm b{font-weight:700}
.club{color:var(--ink-2);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.bib{display:inline-block;border-radius:5px;padding:0 6px;font-size:12px;font-weight:700;line-height:19px;background:var(--surface);border:1.5px solid var(--ink)}
.sx{display:inline-block;min-width:18px;text-align:center;font-weight:700;font-size:12px}
.sx.F{color:var(--f)}.sx.M{color:var(--m)}
.cat{font-size:13px;color:var(--ink-2)}
.cat b{color:var(--ink);font-weight:700}
.pts{font-family:var(--display);font-size:20px;color:var(--green-dark)}
.chipcell{display:inline-block;min-width:32px;text-align:center;border-radius:6px;padding:1px 6px;font-size:12px;background:var(--surface)}
.chipcell.kept{background:var(--green);color:#fff;font-weight:700}
.more{display:flex;justify-content:center;padding:12px}
.teamrow td{vertical-align:top}
.members{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink-2);font-size:12.5px;white-space:normal;padding-top:3px}
.members span{cursor:pointer}
.members span:hover{color:var(--green)}
.members span b{color:var(--ink);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:1px 7px;background:var(--amber-soft);color:#8a5a00}
.note{font-size:13px;color:var(--ink-2);margin:4px 0 0}

/* Barème / encadrés */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;background:var(--blue-soft);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:26px}
.rules label{display:flex;flex-direction:column;gap:5px;font-family:var(--display);font-size:15px;color:var(--ink)}
.rules p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.rules .full{grid-column:1/-1;border-top:1px solid rgba(3,145,218,.2);padding-top:14px}
.chgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:22px}
.chgroup{background:var(--surface-2);border-radius:var(--r-lg);padding:18px 20px}
.chgroup h3{font-size:17px;margin-bottom:12px}
.chgroup .seg{background:var(--surface)}

/* Statistiques */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:32px}
.kpi{border-radius:var(--r-lg);padding:20px 22px;background:var(--surface-2)}
.kpi:nth-child(5n+1){background:var(--green-soft)}.kpi:nth-child(5n+2){background:var(--blue-soft)}.kpi:nth-child(5n+3){background:var(--amber-soft)}
.kpi .v{font-family:var(--display);font-size:34px;line-height:1}
.kpi .k{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.kpi .s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.grid2{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:24px}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px 26px;min-width:0}
.card h3{font-size:20px;margin-bottom:6px}
.card .cap{font-size:12.5px;color:var(--ink-3);margin:0 0 18px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(80px,170px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hb .track{display:flex;gap:2px;height:16px;align-items:stretch}
.hb .seg1{border-radius:0 4px 4px 0;min-width:2px}
.hb .val{font-weight:700;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.hb[data-tip]{cursor:default}
.hb:hover .lab{color:var(--ink)}
.pyr{display:flex;flex-direction:column;gap:8px}
.pyr .row{display:grid;grid-template-columns:1fr 56px 1fr;gap:6px;align-items:center;font-size:12.5px}
.pyr .l{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.pyr .rr{display:flex;align-items:center;gap:6px}
.pyr .b{height:14px;min-width:2px}
.pyr .l .b{border-radius:4px 0 0 4px;background:var(--f)}
.pyr .rr .b{border-radius:0 4px 4px 0;background:var(--m)}
.pyr .mid{text-align:center;font-weight:700;color:var(--ink-2)}
.cols{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line);padding-top:16px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;position:relative}
.cols .c span{display:block;min-height:1px}
.cols .c span:first-child{border-radius:4px 4px 0 0}
.cols-x{display:flex;gap:2px;font-size:11px;color:var(--ink-3);margin-top:4px}
.cols-x span{flex:1;text-align:center;min-width:0;overflow:hidden}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;z-index:50;max-width:260px;line-height:1.35}
.podium{display:flex;flex-direction:column;gap:8px}
.podium .pr{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--surface-2);border-radius:var(--r);padding:10px 14px;cursor:pointer}
.podium .pr:hover{background:var(--surface-3)}

/* Vide / import */
.empty{border-radius:var(--r-lg);padding:30px 20px;text-align:center;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font-size:28px}
.empty p{margin:0;max-width:58ch;color:var(--ink-2)}
.drop{position:fixed;inset:0;background:rgba(37,39,37,.35);display:flex;align-items:center;justify-content:center;z-index:30;padding:max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 20px 60px rgba(0,0,0,.2);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:28px}
.sheet p{margin:0;color:var(--ink-2)}
.dz{border:2px dashed var(--green);border-radius:var(--r);padding:26px 16px;text-align:center;background:var(--green-soft);color:var(--ink);cursor:pointer}
.dz.over{background:var(--amber-soft);border-color:var(--amber)}
.parsed{background:var(--surface-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.parsed b{font-weight:700}
.err{color:var(--pink);font-weight:700}
.row-end{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* Fiches (coureur, entreprise) */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--surface);box-shadow:-20px 0 50px rgba(0,0,0,.15);z-index:20;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:20px;border-radius:var(--r-lg) 0 0 var(--r-lg)}
.panel h2{font-size:30px;padding-right:40px}
.panel h2 span{font-family:var(--body);text-transform:none;font-weight:600;font-size:22px}
.panel h3{font-size:18px}
.panel .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink-2);font-weight:600}
.panel .eyebrow{display:flex;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:var(--r);padding:10px}
.stat:nth-child(1){background:var(--green-soft)}.stat:nth-child(2){background:var(--blue-soft)}.stat:nth-child(3){background:var(--amber-soft)}
.stat .v{font-family:var(--display);font-size:28px;line-height:1}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin-top:4px}
.close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));border:0;background:var(--surface-2);border-radius:999px;width:34px;height:34px;font-size:18px}
.scrim{position:fixed;inset:0;background:rgba(37,39,37,.3);z-index:19}
.foot{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.foot .btn{font-size:14px;padding:6px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-weight:600;z-index:40;max-width:calc(100% - 32px)}
@media (max-width:760px){
  .top{grid-template-columns:auto 1fr auto}
  .top .logo{width:56px}
}
@media (max-width:640px){.hide-sm{display:none}th,td{padding:9px 9px}.rl-row{padding:16px}.card{padding:18px}.club{max-width:150px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>

const S={

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const toSec=t=>{const p=t.split(":").map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]};
const fmtT=s=>{if(s==null||!isFinite(s))return"";s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const fmtPace=s=>{s=Math.round(s);return Math.floor(s/60)+"'"+String(s%60).padStart(2,"0")};
const fmtDots=iso=>iso.split("-").reverse().join(".");
const fmtDate=iso=>new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const fmtDateLong=iso=>new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const nf=n=>Number(n).toLocaleString("fr-FR");
const catBase=c=>(c&&/[MF]$/.test(c)&&c.length>=3)?c.slice(0,-1):c;
const catSort=(a,b)=>{const ia=CAT_ORDER.indexOf(a),ib=CAT_ORDER.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib)||String(a).localeCompare(b)};
function splitName(full){const t=full.split(" ");let i=0;while(i<t.length-1&&t[i]===t[i].toUpperCase()&&/\p{L}/u.test(t[i]))i++;if(i===0)i=1;return{nom:t.slice(0,i).join(" "),prenom:t.slice(i).join(" ")}}
const nameHtml=full=>{const {nom,prenom}=splitName(full);return`<span class="nm"><b>${esc(nom)}</b> ${esc(prenom)}</span>`};
const posHtml=p=>`<span class="pos ${p<=3?"p"+p:""}">${p}</span>`;
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const isIND=c=>!c||/^IND$/i.test(c.trim());

const calOf=n=>CAL.find(c=>c.n===n)||{};
const birthYear=ne=>{const y=Number(ne);return y<=40?2000+y:1900+y};

const unpackRow=a=>({clt:a[0],nom:a[1],nat:a[2],dos:a[3],ne:a[4],cc:a[5],cat:a[6],cs:a[7],sx:a[8],t:a[9],al:a[10],club:a[11]});
const unpackTeam=a=>({rank:a[0],label:a[1],club:a[2],num:a[3],pts:a[4],scr:a[5],t:a[6],dos:a[7],computed:!!a[8]});
/* ---------- Chargement des résultats publiés (dossier data/) ---------- */
async function loadData(){
  try{
    const idx=await fetch("data/index.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
    await Promise.all(idx.races.map(async m=>{
      const c=await fetch("data/"+m.file,{cache:"no-cache"}).then(r=>r.json());
      for(const [d,D] of Object.entries(c.dists)){S.rows[m.n+"|"+d]=D.rows.map(unpackRow);S.teams[m.n+"|"+d]=D.teams.map(unpackTeam)}
      S.races[m.n]={n:m.n,date:m.date,dists:m.dists};S.loaded[m.n]=1;
    }));
    $("#syncState").textContent=idx.updated?"Mis à jour le "+new Date(idx.updated).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})+".":"";
  }catch(e){console.error(e);$("#syncState").textContent="Les résultats n'ont pas pu être chargés. Rechargez la page."}
  render();
}

/* ---------- Index coureurs / entreprises sur la saison ---------- */
function allRunners(){
  const by={};
  for(const n of racesWithData())for(const d of Object.keys(S.races[n].dists))for(const r of S.rows[n+"|"+d]||[]){
    const p=by[r.dos]=by[r.dos]||{dos:r.dos,nom:r.nom,club:r.club,sx:r.sx,cat:r.cat,ne:r.ne,runs:[]};
    p.nom=r.nom;p.club=r.club;p.cat=r.cat;p.runs.push({n,d,r});
  }
  return by;
}
function allClubs(){
  const by={};
  for(const p of Object.values(allRunners())){if(isIND(p.club))continue;const c=by[p.club]=by[p.club]||{club:p.club,runners:0,parts:0};c.runners++;c.parts+=p.runs.length}
  return by;
}

/* ---------- Classements de saison ---------- */
function challengeTable(ch){
  const races=racesWithData();const people={};
  for(const n of races){
    let rows=(S.rows[n+"|"+ch.d]||[]).filter(r=>r.sx===ch.sx&&(!ch.m3||M3PLUS.has(catBase(r.cat))));
    rows=rows.slice().sort((a,b)=>a.cs-b.cs);const N=rows.length;
    rows.forEach((r,i)=>{const place=i+1;const p=people[r.dos]=people[r.dos]||{dos:r.dos,nom:r.nom,club:r.club,cat:r.cat,res:{}};
      p.nom=r.nom;p.club=r.club;p.cat=r.cat;p.res[n]={place,pts:S.s.mode==="deg"?N-place+1:place}});
  }
  let list=Object.values(people);
  for(const p of list){const vals=races.filter(n=>p.res[n]).map(n=>({n,v:p.res[n].pts}));
    vals.sort((a,b)=>S.s.mode==="deg"?b.v-a.v:a.v-b.v);
    const kept=S.s.best>0?vals.slice(0,S.s.best):vals;p.kept=new Set(kept.map(x=>x.n));
    p.total=kept.reduce((s,x)=>s+x.v,0);p.nb=vals.length;p.best=Math.min(...vals.map(x=>p.res[x.n].place))}
  list=list.filter(p=>p.nb>=S.s.min);
  list.sort(S.s.mode==="deg"?(a,b)=>b.total-a.total||b.nb-a.nb||a.best-b.best:(a,b)=>b.nb-a.nb||a.total-b.total||a.best-b.best);
  list.forEach((p,i)=>p.rank=i+1);
  const byCat={};for(const p of list){const c=catBase(p.cat);byCat[c]=(byCat[c]||0)+1;p.rankCat=byCat[c]}
  return{list,races};
}
function teamSeason(d){
  const races=racesWithData();const by={};
  for(const n of races){const teams=S.teams[n+"|"+d]||[];const N=teams.length;
    for(const t of teams){const pts=N-t.rank+1;const e=by[t.club]=by[t.club]||{club:t.club,res:{},teams:0};
      e.res[n]=S.s.all?(e.res[n]||0)+pts:Math.max(e.res[n]||0,pts);e.teams=Math.max(e.teams,t.num)}}
  const list=Object.values(by).map(e=>({...e,total:races.reduce((s,n)=>s+(e.res[n]||0),0),nb:races.filter(n=>e.res[n]).length}));
  list.sort((a,b)=>b.total-a.total||b.nb-a.nb);list.forEach((e,i)=>e.rank=i+1);return{list,races};
}

function hbars(items,max,colors){
  return`<div class="hbars">${items.map(it=>`<div class="hb" data-tip="${esc(it.tip||"")}"><span class="lab" title="${esc(it.label)}">${it.labelHtml||esc(it.label)}</span><span class="track">${it.vals.map((v,i)=>v?`<span class="seg1" style="width:${(v/max*100).toFixed(2)}%;background:${colors[i]}"></span>`:"").join("")}</span><span class="val">${nf(it.total??it.vals.reduce((a,b)=>a+b,0))}</span></div>`).join("")}</div>`;
}
function pageStats(){
  const races=racesWithData();
  const head=`<a class="back" href="#accueil" data-go="accueil">← Accueil</a><div class="pagehead"><div><h2>Statistiques</h2><div class="sub">Saison 2026-2027 · ${races.length} cross sur ${CAL.length}</div></div></div>`;
  if(!races.length)return head+emptyState();
  const runners=Object.values(allRunners());
  let parts=0,partsF=0,dist=0;const clubs={};
  for(const n of races)for(const d of Object.keys(S.races[n].dists)){const rows=S.rows[n+"|"+d]||[];parts+=rows.length;partsF+=rows.filter(r=>r.sx==="F").length;dist+=rows.length*S.races[n].dists[d].km}
  for(const p of runners){if(isIND(p.club))continue;const c=clubs[p.club]=clubs[p.club]||{club:p.club,F:0,M:0,parts:0};c[p.sx]++;c.parts+=p.runs.length}
  const nF=runners.filter(p=>p.sx==="F").length;
  const assidus=runners.filter(p=>new Set(p.runs.map(x=>x.n)).size===races.length).length;
  const ages=runners.map(p=>2026-birthYear(p.ne));const avgAge=ages.reduce((a,b)=>a+b,0)/ages.length;
  const kpi=(v,k,s="")=>`<div class="kpi"><div class="v num">${v}</div><div class="k">${k}</div>${s?`<div class="s">${s}</div>`:""}</div>`;
  // participations par cross
  const maxP=Math.max(...races.map(n=>(S.rows[n+"|long"]||[]).length+(S.rows[n+"|court"]||[]).length));
  const perRace=races.map(n=>{const L=(S.rows[n+"|long"]||[]).length,C=(S.rows[n+"|court"]||[]).length;return{label:`N°${n} ${calOf(n).lieu}`,vals:[L,C],tip:`N°${n} ${calOf(n).lieu} : ${L} au cross long, ${C} au cross court`}});
  // entreprises
  const topClubs=Object.values(clubs).sort((a,b)=>(b.F+b.M)-(a.F+a.M)).slice(0,15);
  const maxC=Math.max(...topClubs.map(c=>c.F+c.M),1);
  // catégories
  const catCount={};for(const p of runners){const c=catBase(p.cat);catCount[c]=catCount[c]||{F:0,M:0};catCount[c][p.sx]++}
  const catKeys=Object.keys(catCount).sort(catSort);const maxCat=Math.max(...catKeys.map(c=>Math.max(catCount[c].F,catCount[c].M)),1);
  // fidélité
  const fid={};for(const p of runners){const k=new Set(p.runs.map(x=>x.n)).size;fid[k]=(fid[k]||0)+1}
  const maxFid=Math.max(...Object.values(fid),1);
  // distribution des temps du cross long (tranches de 2 min)
  const longT=[];for(const n of races)for(const r of S.rows[n+"|long"]||[])longT.push(r);
  let histo="";
  if(longT.length){const b=120;const lo=Math.floor(Math.min(...longT.map(r=>r.t))/b)*b,hi=Math.ceil(Math.max(...longT.map(r=>r.t))/b)*b;
    const bins=[];for(let t=lo;t<hi;t+=b)bins.push({t,F:0,M:0});for(const r of longT){const i=Math.min(bins.length-1,Math.floor((r.t-lo)/b));bins[i][r.sx]++}
    const mx=Math.max(...bins.map(x=>x.F+x.M),1);
    histo=`<div class="cols">${bins.map(x=>`<div class="c" data-tip="${fmtT(x.t)} – ${fmtT(x.t+b)} : ${x.F+x.M} arrivées (${x.F} F, ${x.M} H)"><span style="height:${(x.F/mx*130).toFixed(1)}px;background:var(--f)"></span><span style="height:${(x.M/mx*130).toFixed(1)}px;background:var(--m)"></span></div>`).join("")}</div>
    <div class="cols-x">${bins.map((x,i)=>`<span>${i%Math.ceil(bins.length/8)===0?fmtT(x.t).replace(/:00$/,""):""}</span>`).join("")}</div>`}
  // meilleurs temps
  const best=(d,sx)=>{const all=[];for(const n of races)for(const r of S.rows[n+"|"+d]||[])if(r.sx===sx)all.push({...r,n});return all.sort((a,b)=>a.t-b.t).slice(0,3)};
  const podium=(title,list)=>`<div><h3 style="font-size:16px;margin-bottom:6px">${title}</h3><div class="podium">${list.map((r,i)=>`<div class="pr" data-dos="${r.dos}">${posHtml(i+1)}<span>${nameHtml(r.nom)}<br><span class="muted" style="font-size:12px">${esc(r.club)} · N°${r.n} ${esc(calOf(r.n).lieu)}</span></span><b>${fmtT(r.t)}</b></div>`).join("")||`<span class="muted">—</span>`}</div></div>`;
  // pyramide des âges
  const bands=[["16-19",16,19],["20-29",20,29],["30-39",30,39],["40-49",40,49],["50-59",50,59],["60-69",60,69],["70+",70,120]];
  const pyr=bands.map(([l,a,b])=>({l,F:runners.filter(p=>p.sx==="F"&&2026-birthYear(p.ne)>=a&&2026-birthYear(p.ne)<=b).length,M:runners.filter(p=>p.sx==="M"&&2026-birthYear(p.ne)>=a&&2026-birthYear(p.ne)<=b).length}));
  const mxp=Math.max(...pyr.map(x=>Math.max(x.F,x.M)),1);
  const LEG_FM=`<div class="legend"><span><i style="background:var(--f)"></i>Femmes</span><span><i style="background:var(--m)"></i>Hommes</span></div>`;
  return head+`
  <div class="kpis">
    ${kpi(nf(runners.length),"Coureurs différents",`${nf(nF)} femmes · ${nf(runners.length-nF)} hommes`)}
    ${kpi(nf(parts),"Participations",`${Math.round(partsF/parts*100)} % de femmes`)}
    ${kpi(nf(Object.keys(clubs).length),"Entreprises représentées",`${nf(runners.filter(p=>isIND(p.club)).length)} coureurs individuels`)}
    ${kpi(nf(Math.round(dist)),"Kilomètres parcourus","tous coureurs confondus")}
    ${kpi(nf(assidus),"Présents à tous les cross",races.length<CAL.length?"toujours en lice pour la tombola des 11 cross":"éligibles à la tombola des 11 cross")}
    ${kpi(Math.round(avgAge)+" ans","Âge moyen",`plus jeune ${Math.min(...ages)} ans · plus âgé ${Math.max(...ages)} ans`)}
  </div>
  <div class="grid2">
    <div class="card"><h3>Arrivants par cross</h3><p class="cap">Nombre de coureurs classés à chaque manche.</p>
      <div class="legend"><span><i style="background:var(--green)"></i>Cross long</span><span><i style="background:var(--blue)"></i>Cross court</span></div>
      ${hbars(perRace,maxP,["var(--green)","var(--blue)"])}</div>
    <div class="card"><h3>Meilleurs temps de la saison</h3><p class="cap">Toutes manches confondues.</p>
      <div style="display:flex;flex-direction:column;gap:22px">${podium("Cross long · hommes",best("long","M"))}${podium("Cross long · femmes",best("long","F"))}${podium("Cross court · femmes",best("court","F"))}</div></div>
    <div class="card"><h3>Entreprises les plus représentées</h3><p class="cap">Coureurs différents sur la saison (hors individuels). Cliquez pour voir l'équipe.</p>${LEG_FM}
      ${hbars(topClubs.map(c=>({label:c.club,labelHtml:`<span data-club="${esc(c.club)}" style="cursor:pointer">${esc(c.club)}</span>`,vals:[c.F,c.M],tip:`${c.club} : ${c.F+c.M} coureurs (${c.F} F, ${c.M} H), ${c.parts} participations`})),maxC,["var(--f)","var(--m)"])}</div>
    <div class="card"><h3>Pyramide des âges</h3><p class="cap">Coureurs différents par tranche d'âge (âge atteint en 2026).</p>${LEG_FM}
      <div class="pyr">${pyr.slice().reverse().map(x=>`<div class="row" data-tip="${x.l} ans : ${x.F} femmes, ${x.M} hommes"><div class="l"><span class="num">${x.F}</span><span class="b" style="width:${(x.F/mxp*100).toFixed(1)}%"></span></div><div class="mid">${x.l}</div><div class="rr"><span class="b" style="width:${(x.M/mxp*100).toFixed(1)}%"></span><span class="num">${x.M}</span></div></div>`).join("")}</div></div>
    <div class="card"><h3>Coureurs par catégorie</h3><p class="cap">Coureurs différents sur la saison.</p>${LEG_FM}
      ${hbars(catKeys.map(c=>({label:CAT_NAME[c]||c,vals:[catCount[c].F,catCount[c].M],tip:`${CAT_NAME[c]||c} : ${catCount[c].F} femmes, ${catCount[c].M} hommes`})),Math.max(...catKeys.map(c=>catCount[c].F+catCount[c].M),1),["var(--f)","var(--m)"])}</div>
    <div class="card"><h3>Répartition des temps · cross long</h3><p class="cap">Nombre d'arrivées par tranche de 2 minutes, toutes manches du cross long.</p>${LEG_FM}${histo}</div>
    <div class="card"><h3>Fidélité</h3><p class="cap">Nombre de coureurs selon le nombre de cross courus.</p>
      ${hbars(Object.keys(fid).map(Number).sort((a,b)=>b-a).map(k=>({label:`${k} cross`,vals:[fid[k]],tip:`${fid[k]} coureurs ont couru ${k} cross`})),maxFid,["var(--green)"])}</div>
  </div>`;
}

/* ---------- Rendu principal ---------- */
function render(){
  const v=$("#view");
  if(S.view==="course"&&(!S.race||!S.loaded[S.race]))S.view="accueil";
  const fid=document.activeElement&&document.activeElement.id;const caret=document.activeElement&&document.activeElement.selectionStart;
  v.innerHTML=S.view==="course"?pageCourse():S.view==="saison"?pageSaison():S.view==="stats"?pageStats():pageAccueil();
  if(fid&&["q","sq","gq"].includes(fid)){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(caret,caret)}catch(e){}}}
  if(S.view==="accueil")renderSearch();
}
function go(view,opts={}){
  S.view=view;S.limit=150;if(opts.race)S.race=opts.race;if(opts.rtab)S.rtab=opts.rtab;
  if(view==="course"){S.f={q:"",sx:"",cat:"",club:"",td:opts.rtab==="equipes"?S.f.td:""};S.sort={k:"clt",dir:1}}
  try{history.replaceState(null,"","#"+(view==="course"?"course"+S.race:view))}catch(_){}
  $("#overlay").innerHTML="";render();window.scrollTo({top:0});
}

/* ---------- Fiches ---------- */
function openRunner(dos){
  const p=allRunners()[dos];if(!p)return;const {nom,prenom}=splitName(p.nom);
  const hits=p.runs.map(h=>({...h,N:(S.rows[h.n+"|"+h.d]||[]).filter(x=>x.sx===h.r.sx).length}));
  const teamOf=h=>(S.teams[h.n+"|"+h.d]||[]).find(t=>t.dos.includes(dos));
  $("#overlay").innerHTML=`<div class="scrim" data-act="close"></div><aside class="panel" role="dialog" aria-label="Fiche coureur">
    <button class="close" type="button" data-act="close" aria-label="Fermer">×</button>
    <div><div class="eyebrow">Dossard <span class="bib">${dos}</span></div><h2>${esc(nom)} <span>${esc(prenom)}</span></h2></div>
    <div class="meta"><span ${isIND(p.club)?"":`data-club="${esc(p.club)}" style="cursor:pointer;color:var(--blue)"`}>${esc(p.club)}</span><span>${esc(CAT_NAME[catBase(p.cat)]||p.cat)} · ${p.sx==="F"?"Femme":"Homme"}</span><span>Né(e) en ${birthYear(p.ne)}</span></div>
    <div class="stats"><div class="stat"><div class="v">${new Set(hits.map(h=>h.n)).size}</div><div class="k">Cross courus</div></div><div class="stat"><div class="v">${Math.min(...hits.map(h=>h.r.cs))}</div><div class="k">Meilleure place ${p.sx==="F"?"féminine":"masculine"}</div></div><div class="stat"><div class="v">${Math.min(...hits.map(h=>h.r.cc))}</div><div class="k">Meilleure place cat.</div></div></div>
    <div class="tablebox"><table><thead><tr><th>Cross</th><th class="r">Scratch</th><th class="r">Sexe</th><th class="r">Cat.</th><th class="r">Temps</th></tr></thead><tbody>
    ${hits.map(h=>{const c=calOf(h.n);const t=teamOf(h);return`<tr class="click" data-race="${h.n}" data-rtab="${h.d}"><td style="white-space:normal"><b>N°${h.n}</b> ${esc(c.lieu||"")}<br><span class="muted" style="font-size:12px">${DIST_LABEL[h.d]||h.d}${t?` · équipe ${esc(t.club)} – ${t.num} : ${t.rank}e`:""}</span></td>
      <td class="r">${h.r.clt}</td><td class="r">${h.r.cs}<span class="muted">/${h.N}</span></td><td class="r">${h.r.cc} <span class="muted">${esc(h.r.cat)}</span></td><td class="r"><b>${fmtT(h.r.t)}</b><br><span class="muted" style="font-size:12px">${esc(h.r.al)}/km</span></td></tr>`}).join("")}
    </tbody></table></div></aside>`;
  $(".panel .close").focus();
}
function openClub(club){
  const runners=Object.values(allRunners()).filter(p=>p.club===club);if(!runners.length)return;
  const races=racesWithData();
  const teamRes=races.map(n=>{const out={n};for(const d of ["long","court"]){const ts=(S.teams[n+"|"+d]||[]).filter(t=>t.club===club);out[d]=ts.length?{best:Math.min(...ts.map(t=>t.rank)),count:ts.length,of:(S.teams[n+"|"+d]||[]).length}:null;out[d+"N"]=(S.rows[n+"|"+d]||[]).filter(r=>r.club===club).length}return out});
  runners.sort((a,b)=>b.runs.length-a.runs.length||a.nom.localeCompare(b.nom,"fr"));
  const nF=runners.filter(p=>p.sx==="F").length;
  $("#overlay").innerHTML=`<div class="scrim" data-act="close"></div><aside class="panel" role="dialog" aria-label="Fiche équipe">
    <button class="close" type="button" data-act="close" aria-label="Fermer">×</button>
    <div><div class="eyebrow">Équipe</div><h2>${esc(club)}</h2></div>
    <div class="stats"><div class="stat"><div class="v">${runners.length}</div><div class="k">Coureurs</div></div><div class="stat"><div class="v">${nF}</div><div class="k">Femmes</div></div><div class="stat"><div class="v">${runners.reduce((s,p)=>s+p.runs.length,0)}</div><div class="k">Participations</div></div></div>
    <h3>Classement des équipes par cross</h3>
    <div class="tablebox"><table><thead><tr><th>Cross</th><th class="r">Mixtes · long</th><th class="r">Femmes · court</th></tr></thead><tbody>
    ${teamRes.map(t=>`<tr class="click" data-race="${t.n}" data-rtab="equipes"><td><b>N°${t.n}</b> ${esc(calOf(t.n).lieu)}<br><span class="muted" style="font-size:12px">${t.longN} au long · ${t.courtN} au court</span></td>
      <td class="r">${t.long?`<b>${t.long.best}e</b><span class="muted">/${t.long.of}</span>${t.long.count>1?`<br><span class="muted" style="font-size:12px">${t.long.count} équipes</span>`:""}`:`<span class="muted">–</span>`}</td>
      <td class="r">${t.court?`<b>${t.court.best}e</b><span class="muted">/${t.court.of}</span>${t.court.count>1?`<br><span class="muted" style="font-size:12px">${t.court.count} équipes</span>`:""}`:`<span class="muted">–</span>`}</td></tr>`).join("")}
    </tbody></table></div>
    <h3>Coureurs</h3>
    <div class="tablebox"><table><thead><tr><th>Coureur</th><th>Cat.</th><th class="r">Cross</th><th class="r">Meilleure place</th></tr></thead><tbody>
    ${runners.map(p=>`<tr class="click" data-dos="${p.dos}"><td>${nameHtml(p.nom)}</td><td class="cat">${esc(p.cat)}</td><td class="r">${new Set(p.runs.map(x=>x.n)).size}</td><td class="r">${Math.min(...p.runs.map(x=>x.r.cs))} <span class="sx ${p.sx}">${p.sx}</span></td></tr>`).join("")}
    </tbody></table></div></aside>`;
  $(".panel .close").focus();
}

/* ---------- Événements ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-go],[data-race],[data-rtab],[data-sx],[data-sort],[data-ch],[data-td],[data-dos],[data-club]");
  if(!t){if(!e.target.closest(".searchzone")&&$("#gres")){$("#gres").innerHTML=""}return}
  const a=t.dataset;
  if(t.tagName==="A"&&!a.go)return;
  if(a.go){e.preventDefault();return go(a.go)}
  if(a.act==="close"||(a.act==="bg"&&e.target===t)){$("#overlay").innerHTML="";return}
  if(a.act==="more"){S.limit+=300;return render()}
  if(a.race){const n=+a.race;if(!S.loaded[n])return;return go("course",{race:n,rtab:a.rtab||S.rtab})}
  if(a.rtab){S.rtab=a.rtab;S.limit=150;S.f.cat="";S.f.club="";return render()}
  if(a.td){S.f.td=a.td;return render()}
  if(a.sx!==undefined){S.f.sx=a.sx;S.f.cat="";S.limit=150;return render()}
  if(a.sort){S.sort=S.sort.k===a.sort?{k:a.sort,dir:-S.sort.dir}:{k:a.sort,dir:1};return render()}
  if(a.ch){S.s.ch=a.ch;S.s.cat="";S.s.club="";S.limit=150;return render()}
  if(a.club)return openClub(a.club);
  if(a.dos)return openRunner(+a.dos);
});
let qTimer=null;
document.addEventListener("input",e=>{
  const id=e.target.id,v=e.target.value;
  if(id==="gq"){S.q=v;S.qsel=0;renderSearch();return}
  if(id==="q"||id==="sq"){clearTimeout(qTimer);qTimer=setTimeout(()=>{if(id==="q")S.f.q=v;else S.s.q=v;S.limit=150;render()},160)}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#overlay").innerHTML)$("#overlay").innerHTML="";else if($("#gres"))$("#gres").innerHTML="";return}
  if(e.target.id==="gq"){const items=[...document.querySelectorAll("#gres .results button")];if(!items.length)return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();S.qsel=(S.qsel+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;renderSearch()}
    else if(e.key==="Enter"){e.preventDefault();items[Math.min(S.qsel,items.length-1)].click()}}
});
document.addEventListener("change",e=>{
  const id=e.target.id,v=e.target.value;
  if(id==="fcat")S.f.cat=v;else if(id==="fclub")S.f.club=v;
  else if(id==="smode")S.s.mode=v;else if(id==="sbest")S.s.best=+v;else if(id==="smin")S.s.min=+v;
  else if(id==="scat")S.s.cat=v;else if(id==="sclub")S.s.club=v;else if(id==="tall")S.s.all=v==="1";else return;
  S.limit=150;render();
});
/* Infobulles des graphiques */
document.addEventListener("pointermove",e=>{
  const el=e.target.closest&&e.target.closest("[data-tip]");const tip=$("#tip");
  if(!el||!el.dataset.tip){tip.hidden=true;return}
  tip.textContent=el.dataset.tip;tip.hidden=false;
  const x=Math.min(e.clientX+14,window.innerWidth-tip.offsetWidth-8),y=e.clientY+16+tip.offsetHeight>window.innerHeight?e.clientY-tip.offsetHeight-10:e.clientY+16;
  tip.style.left=x+"px";tip.style.top=y+"px";
});

const h=(location.hash||"").slice(1);
if(["accueil","saison","stats"].includes(h))S.view=h;
else if(/^course\d+$/.test(h)){S.view="course";S.race=+h.slice(6)}
render();loadData();
</script>

</body>
</html>
